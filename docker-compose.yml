version: '3.8'

services:
  # Redis for Celery broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Flask Backend
  db-ai-ops-backend:
    build: ./backend
    image: db-ai-ops-platform-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backups:/app/backups
      - ./deployments:/app/deployments:ro
    environment:
      - FLASK_ENV=production
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
      - DATABASE_URI=sqlite:///backups.db
      - DEPLOYMENT_DBOPS_ROOT=/app/deployments/dbops_mysql
      - DEPLOYMENT_KNOWN_HOSTS_PATH=/app/deployments/known_hosts/known_hosts
    depends_on:
      - redis
    command: python run.py

  # Celery Worker
  db-ai-ops-worker:
    build: ./backend
    image: db-ai-ops-platform-backend:latest
    volumes:
      - ./backend:/app
      - ./backups:/app/backups
      - ./deployments:/app/deployments:ro
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
      - DEPLOYMENT_DBOPS_ROOT=/app/deployments/dbops_mysql
      - DEPLOYMENT_KNOWN_HOSTS_PATH=/app/deployments/known_hosts/known_hosts
    depends_on:
      - redis
    command: celery -A db_ai_ops.celery_app:celery worker --loglevel=info

  # Celery Beat (Scheduler)
  db-ai-ops-beat:
    build: ./backend
    image: db-ai-ops-platform-backend:latest
    volumes:
      - ./backend:/app
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A db_ai_ops.celery_app:celery beat --loglevel=info

  # Frontend (Development)
  db-ai-ops-frontend:
    build: ./frontend
    image: db-ai-ops-platform-frontend:latest
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  redis_data:
